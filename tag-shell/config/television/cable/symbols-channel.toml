[metadata]
name = "symbols"
description = "Search code symbols (functions, classes, types) and jump to definition"

[source]
command = "tv-symbols-source"
# Entries are `path:line:col:matched source text`. Trim the printed selection to
# `path:line` (the `..2` range is exclusive) so a piped `tv symbols` stays parseable.
output = "{split:\\::..2}"

[preview]
# Pass only the path and line fields through tv's own template filters, quoted.
# Interpolating the raw `{}` entry instead lets the matched source text reach the
# shell, where glob chars (`*`) and definition syntax (`() {`) break the preview.
command = "bat --color=always --style=numbers --highlight-line '{split:\\::1}' '{split:\\::0}'"
offset = "{split:\\::1}"

[ui]
preview_panel = { size = 65, scrollbar = true }
input_bar.prompt = "sym ❯ "

[keybindings]
enter = "actions:edit"

[actions.edit]
description = "Open file in editor at line"
command = "${EDITOR:-vim} '+{split:\\::1}' '{split:\\::0}'"
shell = "bash"
mode = "execute"
