#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
sort_by     = "natural"
show_hidden = true
linemode    = "size"

[preview]
tab_size = 2

# zshrc only exports EDITOR for interactive shells, so name nvim directly
# rather than relying on the preset's `${EDITOR:-vi}` fallback.
[opener]
edit = [
	{ run = "nvim %s", desc = "nvim", block = true, for = "unix" },
]
